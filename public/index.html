<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Website Identity -->
    <title>NADIR.DEV | Frontend Developer</title>

    <meta
      name="description"
      content="Nadir Ahmed is a Frontend Developer specializing in React, JavaScript, and building modern, responsive web experiences."
    />

    <meta
      name="keywords"
      content="Nadir Ahmed, Frontend Developer, React Developer, JavaScript, React, Web Development, Portfolio"
    />

    <meta name="author" content="Nadir Ahmed" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NADIR.DEV | Frontend Developer" />
    <meta
      property="og:description"
      content="Explore my projects, technical skills, and experience building modern web applications."
    />
    <meta property="og:site_name" content="NADIR.DEV" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NADIR.DEV | Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend Developer portfolio showcasing React and JavaScript projects."
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Netlify Forms Detection -->
    <meta name="form-detection" content="contact-form" />
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this website. </noscript>

    <!-- Netlify Forms: Static Form Detection -->
    <form
      name="contact-form"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact-form" />

      <p>
        <label>
          Don't fill this out:
          <input name="bot-field" />
        </label>
      </p>

      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
  </body>
</html>
